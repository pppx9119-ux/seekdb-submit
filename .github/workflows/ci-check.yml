name: SeekDB full build and FTS benchmark

# Cloud-side verification for the full-text index performance work.
#
# The branch is based on the official 2026-competition baseline.  This job
# initializes the packaged third-party dependencies, configures the release
# CMake build, compiles and links the complete `seekdb` executable, starts the
# server and runs the repository's official FTS benchmark
# (tools/benchmark/fts_large_bench.sh) with the baseline parameters.
#
# It then checks out the competition baseline commit, rebuilds only the changed
# translation units in the same build directory, and runs the same benchmark on
# the same runner.  The two reports therefore form a controlled before/after
# comparison; the official benchmark scripts, data and scoring inputs are not
# modified.
#
# Debug info is stripped (-g0) only to keep the build inside the hosted
# runner's disk budget; the optimisation level and NDEBUG match the release
# build produced by `build.sh release`.  Compilation retries automatically
# with lower parallelism if the runner runs out of memory.

on:
  workflow_dispatch:
  push:
    branches:
      - competition/fts-perf-v2
    paths:
      - '.github/workflows/ci-check.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - 'cmake/**'
      - 'deps/init/**'
      - 'tools/cmake/**'
      - 'rust/**'

permissions:
  contents: read

concurrency:
  group: seekdb-fts-perf-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: 1
  BASELINE_SHA: 5bce9e06d1281347ad61344e4b01fab9158c58a2

jobs:
  build-and-benchmark:
    name: Full build and FTS benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /
          nproc

      - name: Restore third-party dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/3rd
          key: seekdb-deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: Restore Rust build artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: build_release/rust-target
          key: seekdb-rust-release-${{ hashFiles('rust/**', 'cmake/Rust.cmake') }}

      - name: Restore compiler cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: seekdb-fts-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seekdb-fts-ccache-

      - name: Initialize dependencies and configure CMake
        run: |
          ./build.sh release --init \
            -DOB_USE_CCACHE=ON \
            -DNEED_PARSER_CACHE=OFF \
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG" \
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG"

      - name: Save third-party dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/3rd
          key: seekdb-deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: Save Rust build artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build_release/rust-target
          key: seekdb-rust-release-${{ hashFiles('rust/**', 'cmake/Rust.cmake') }}

      - name: Build seekdb binary (branch)
        timeout-minutes: 315
        run: |
          set -uo pipefail
          export PATH="$PWD/deps/3rd/usr/local/oceanbase/devtools/bin:$PATH"
          which ccache
          ccache -s || true
          cd build_release || exit 1

          rc=1
          for jobs in 4 3 2 1; do
            log="$GITHUB_WORKSPACE/build-j${jobs}.log"
            echo "=== make -j${jobs} seekdb ($(date -u +%H:%M:%S)) ==="
            started=$(date +%s)
            make -j"${jobs}" seekdb > "$log" 2>&1 &
            make_pid=$!
            (
              while kill -0 "$make_pid" 2>/dev/null; do
                sleep 300
                if kill -0 "$make_pid" 2>/dev/null; then
                  built=$(grep -c "Building CXX object" "$log" 2>/dev/null || true)
                  echo "[progress] $(date -u +%H:%M:%S) compiled objects: ${built:-0}"
                fi
              done
            ) &
            reporter=$!

            set +e
            wait "$make_pid"
            rc=$?
            set -e
            kill "$reporter" 2>/dev/null || true
            wait "$reporter" 2>/dev/null || true

            echo "make -j${jobs} exited with ${rc} after $(( $(date +%s) - started ))s"
            if [ "$rc" -eq 0 ]; then
              break
            fi
            tail -n 150 "$log"
            if grep -qE "Killed signal|Killed|out of memory|virtual memory exhausted|internal compiler error|Error 137" "$log"; then
              echo "resource exhaustion detected; retrying with lower parallelism"
              continue
            fi
            echo "build failed for a non-resource reason"
            exit "$rc"
          done

          if [ "$rc" -ne 0 ]; then
            echo "all build attempts failed"
            exit "$rc"
          fi
          ls -lh src/observer/seekdb

      - name: Save compiler cache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: seekdb-fts-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify built binary
        run: |
          ls -lh build_release/src/observer/seekdb
          build_release/src/observer/seekdb --version

      - name: Run FTS benchmark (branch)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          INSTANCE="$PWD/.bench_instance"
          cleanup() {
            python3 .github/script/seekdb/sdb.py stop --base-dir "$INSTANCE" || true
          }
          trap cleanup EXIT

          rm -rf "$INSTANCE"
          python3 .github/script/seekdb/sdb.py start \
            --binary "$PWD/build_release/src/observer/seekdb" \
            --base-dir "$INSTANCE" \
            --port 2881
          python3 .github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT_ROOT/bin/obclient" \
            --base-dir "$INSTANCE" \
            --host 127.0.0.1 \
            --port 2881 \
            --user root \
            --timeout 600

          # A single ddl build varies by tens of percent between runs on the same
          # runner, so the comparison below uses the median of several reports
          # instead of one sample.  The first run warms the instance and is kept
          # only to make that warm up identical on both sides.
          for run in $(seq 1 6); do
            echo "=== BENCH RUN branch ${run}/6 ==="
            MYSQL="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -N -s -A --default-character-set=utf8mb4" \
            MYSQL_VERBOSE="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -A --default-character-set=utf8mb4" \
            LABEL=branch \
            OUTPUT="$GITHUB_WORKSPACE/fts_bench_after.txt" \
            bash tools/benchmark/fts_large_bench.sh
          done

          # Read-only diagnostics, run after the benchmark so they cannot perturb it.
          set +e
          CLIENT="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -A --default-character-set=utf8mb4"
          diag() { $CLIENT -e "SET NAMES utf8mb4; $1" 2>&1 | sed 's/^/  /'; }
          echo "=== DIAG explain query_cn ==="
          diag "EXPLAIN SELECT COUNT(*) FROM fts_large_bench.docs WHERE MATCH(title, content) AGAINST('全文索引 分词器');"
          echo "=== DIAG explain query_limit ==="
          diag "EXPLAIN SELECT COUNT(*) FROM (SELECT id FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('倒排索引 tokenizer') LIMIT 20) t;"
          echo "=== DIAG limit early-stop experiment ==="
          for n in 20 20000; do
            : > /tmp/diag_limit.sql
            echo "SET NAMES utf8mb4;" >> /tmp/diag_limit.sql
            for i in $(seq 1 50); do
              echo "SELECT COUNT(*) FROM (SELECT id FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('倒排索引 tokenizer') LIMIT $n) t;" >> /tmp/diag_limit.sql
            done
            start_ns=$(date +%s%N)
            $CLIENT -N -s < /tmp/diag_limit.sql > /dev/null 2>&1
            end_ns=$(date +%s%N)
            echo "  limit=$n total_50_ms=$(( (end_ns - start_ns) / 1000000 ))"
          done

          echo "=== DIAG tokenize-in-scan comparison (20000 distinct documents) ==="
          for p in ik space beng; do
            for col in content title; do
              start_ns=$(date +%s%N)
              out=$($CLIENT -N -s -e "SET NAMES utf8mb4; SELECT COUNT(tokenize($col, '$p')) FROM fts_large_bench.docs;" 2>&1)
              end_ns=$(date +%s%N)
              echo "  parser=$p col=$col total_ms=$(( (end_ns - start_ns) / 1000000 )) result=$(echo "$out" | tail -1)"
            done
          done

          echo "=== DIAG tokenize statement cost (2000 statements in one session) ==="
          IK_TXT='OceanBase是一款非常稳定的数据库，全文索引的分词器热路径优化包括解析器实例复用、停用词全局单例、内存池化数据结构等技术，在大量文档索引和查询场景下可以显著降低 CPU 开销。'
          : > /tmp/diag_select1.sql
          : > /tmp/diag_hit.sql
          : > /tmp/diag_miss.sql
          for f in /tmp/diag_select1.sql /tmp/diag_hit.sql /tmp/diag_miss.sql; do echo "SET NAMES utf8mb4;" >> "$f"; done
          for i in $(seq 1 2000); do
            echo "SELECT 1;" >> /tmp/diag_select1.sql
            echo "SELECT tokenize('$IK_TXT','ik');" >> /tmp/diag_hit.sql
            echo "SELECT tokenize('$IK_TXT $i','ik');" >> /tmp/diag_miss.sql
          done
          for name in select1 hit miss; do
            start_ns=$(date +%s%N)
            $CLIENT -N -s < "/tmp/diag_${name}.sql" > /dev/null 2>&1
            end_ns=$(date +%s%N)
            echo "  tokenize_${name} total_2000_ms=$(( (end_ns - start_ns) / 1000000 ))"
          done

          echo "=== DIAG ddl costs (runner_cores=$(nproc)) ==="
          time_ddl() {
            name=$1
            sql=$2
            start_ns=$(date +%s%N)
            out=$($CLIENT -e "SET NAMES utf8mb4; $sql" 2>&1)
            end_ns=$(date +%s%N)
            echo "  $name total_ms=$(( (end_ns - start_ns) / 1000000 )) msg=$(echo "$out" | head -2 | tr '\n' ';')"
          }
          time_ddl add_stored_column "ALTER TABLE fts_large_bench.docs ADD COLUMN diag_col_1 INT DEFAULT 0;"
          time_ddl add_virtual_column "ALTER TABLE fts_large_bench.docs ADD COLUMN diag_vcol_1 INT GENERATED ALWAYS AS (id + 1) VIRTUAL;"
          time_ddl fts_ik_content_par6 "SET _force_parallel_ddl_dop=6; ALTER TABLE fts_large_bench.docs ADD FULLTEXT INDEX diag_fti_p6(content) WITH PARSER ik;"
          time_ddl fts_ik_content_serial1 "ALTER TABLE fts_large_bench.docs ADD FULLTEXT INDEX diag_fti_s1(content) WITH PARSER ik;"
          time_ddl fts_ik_title_serial1 "ALTER TABLE fts_large_bench.docs ADD FULLTEXT INDEX diag_fti_ts1(title) WITH PARSER ik;"
          time_ddl fts_ik_title_par6 "SET _force_parallel_ddl_dop=6; ALTER TABLE fts_large_bench.docs ADD FULLTEXT INDEX diag_fti_tp6(title) WITH PARSER ik;"
          time_ddl fts_ik_content_serial2 "ALTER TABLE fts_large_bench.docs ADD FULLTEXT INDEX diag_fti_s2(content) WITH PARSER ik;"

          echo "=== DIAG instance shape ==="
          $CLIENT -e "SHOW PARAMETERS LIKE 'memory_limit';" 2>&1 | head -4
          OLOG=$(find "$INSTANCE" -name 'observer.log' -print -quit 2>/dev/null)
          echo "  observer_log=$OLOG"
          if [ -n "$OLOG" ]; then
            grep -a "mini mode" "$OLOG" | head -2 | cut -c1-160
            echo "  --- aux build task timeline ---"
            grep -a "build index sstable finish" "$OLOG" | tail -16 | cut -c1-130
            grep -a "build index sstable finish" "$OLOG" | grep -o "dest_table_id: [0-9]*" | tail -16
            echo "  --- aux build inner sql ---"
            grep -a "index sstable build task send innersql" "$OLOG" | tail -16 | cut -c1-130
          fi

          echo "=== DIAG fts segment profile ==="
          PROF=$(find "$INSTANCE" -name 'observer.log*' 2>/dev/null | xargs -r grep -ah 'FTS_SEG_PROFILE\|FTS_ROW_PROFILE\|FTS_IK_PROFILE' | sort)
          echo "  profile_lines=$(printf '%s\n' "$PROF" | grep -c .)"
          printf '%s\n' "$PROF" | head -72 | cut -c1-210
          echo "  --- profile tail ---"
          printf '%s\n' "$PROF" | tail -12 | cut -c1-210

          echo "=== DIAG ddl word scaling (LEFT(content, N)) ==="
          for n in 0 40 80 160; do
            $CLIENT -e "SET NAMES utf8mb4; DROP TABLE IF EXISTS fts_large_bench.docs_len$n; CREATE TABLE fts_large_bench.docs_len$n (id BIGINT AUTO_INCREMENT PRIMARY KEY, content TEXT NOT NULL) DEFAULT CHARSET = utf8mb4; INSERT INTO fts_large_bench.docs_len$n (content) SELECT LEFT(content, $n) FROM fts_large_bench.docs;" >/dev/null 2>&1
            toks=$($CLIENT -N -s -e "SET NAMES utf8mb4; SELECT COUNT(tokenize(content, 'ik')) FROM fts_large_bench.docs_len$n;" 2>&1 | tail -1)
            time_ddl fts_len$n "ALTER TABLE fts_large_bench.docs_len$n ADD FULLTEXT INDEX fti_len_$n(content) WITH PARSER ik;"
            echo "    len=$n tokens=$toks"
          done
          echo "  --- aux row counts (best effort) ---"
          for t in $($CLIENT -N -s -e "SELECT table_name FROM oceanbase.__all_virtual_table WHERE table_name LIKE '%diag_fti_s1%' OR table_name LIKE '%fti_len_%'" 2>/dev/null | head -12); do
            cnt=$($CLIENT -N -s -e "SELECT COUNT(*) FROM fts_large_bench.\`$t\`" 2>&1 | tail -1)
            echo "    aux_table=$t rows=$cnt"
          done
          echo "=== DIAG end ==="

      - name: Collect seekdb logs on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/seekdb-logs"
          for dir in "$PWD/.bench_instance" "$PWD/.test_instance"; do
            [ -d "$dir" ] || continue
            tag=$(basename "$dir")
            find "$dir" -type f -name 'observer.log*' | while read -r f; do
              out="$GITHUB_WORKSPACE/seekdb-logs/${tag}-$(basename "$f").tail"
              tail -c 4000000 "$f" > "$out"
            done
            find "$dir" -type f \( -name 'observer.log*' -o -name '*.log' \) -print0 2>/dev/null |
              xargs -0 -r grep -h -a -E 'CRASH|FATAL|ERROR|signal [0-9]+|Traceback' 2>/dev/null |
              tail -n 3000 > "$GITHUB_WORKSPACE/seekdb-logs/${tag}-errors.txt"
          done
          ls -lR "$GITHUB_WORKSPACE/seekdb-logs" || true

      - name: Run official FTS mysqltests (branch)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          python3 - <<"PY"
          import pathlib, sys, types

          repo_root = pathlib.Path.cwd()
          sys.path.insert(0, str(repo_root / ".github" / "script" / "seekdb"))
          import mysqltest_for_seekdb as runner

          deploy_dir = repo_root / "tools" / "deploy"
          client_root = repo_root / "deps" / "3rd" / "u01" / "obclient"
          args = types.SimpleNamespace(
              seekdb=str(repo_root / "build_release" / "src" / "observer" / "seekdb"),
              obclient=client_root / "bin" / "obclient",
              mysqltest=client_root / "bin" / "mysqltest",
              base_dir=repo_root / ".test_instance",
              work_dir=repo_root / "mysqltest-work",
              host="127.0.0.1",
              port=2881,
          )
          for path in (args.obclient, args.mysqltest):
              if not path.is_file():
                  raise SystemExit("missing client binary: {}".format(path))

          runner.prepare_instance(args, repo_root, repo_root / ".github" / "script" / "seekdb" / "sdb.py", deploy_dir)

          cases = [c for c in runner.discover_cases(repo_root) if c.name.startswith("fts_index.")]
          print("running {} fts_index cases".format(len(cases)), flush=True)
          tmp_dir = args.work_dir / "tmp"
          log_dir = args.work_dir / "log"
          tmp_dir.mkdir(parents=True, exist_ok=True)
          log_dir.mkdir(parents=True, exist_ok=True)

          failed = []
          for case in cases:
              return_code, output = runner.run_case(args, deploy_dir, case, tmp_dir, log_dir)
              if return_code != 0:
                  failed.append(case.name)
                  print(output, flush=True)

          if failed:
              raise SystemExit("failed cases: {}".format(", ".join(failed)))
          print("all fts_index cases passed", flush=True)
          PY

      - name: Check out competition baseline for comparison
        id: baseline-checkout
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"

          if ! git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null; then
            if ! git fetch --depth=1 origin "$BASELINE_SHA"; then
              git fetch --depth=1 https://github.com/oceanbase/seekdb.git 2026-competition
              test "$(git rev-parse FETCH_HEAD)" = "$BASELINE_SHA"
            fi
          fi

          git checkout --detach "$BASELINE_SHA"
          git log -1 --format='baseline checkout: %H %s'

      - name: Rebuild seekdb binary (baseline, incremental)
        id: baseline-build
        if: steps.baseline-checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 120
        run: |
          set -uo pipefail
          export PATH="$PWD/deps/3rd/usr/local/oceanbase/devtools/bin:$PATH"
          cd build_release || exit 1

          rc=1
          for jobs in 4 2 1; do
            log="$GITHUB_WORKSPACE/baseline-build-j${jobs}.log"
            echo "=== baseline make -j${jobs} seekdb ($(date -u +%H:%M:%S)) ==="
            started=$(date +%s)
            set +e
            make -j"${jobs}" seekdb > "$log" 2>&1
            rc=$?
            set -e
            echo "baseline make -j${jobs} exited with ${rc} after $(( $(date +%s) - started ))s"
            if [ "$rc" -eq 0 ]; then
              break
            fi
            tail -n 150 "$log"
            if grep -qE "Killed signal|Killed|out of memory|virtual memory exhausted|internal compiler error|Error 137" "$log"; then
              echo "resource exhaustion detected; retrying with lower parallelism"
              continue
            fi
            exit "$rc"
          done
          if [ "$rc" -ne 0 ]; then
            echo "baseline build failed"
            exit "$rc"
          fi
          ls -lh src/observer/seekdb

      - name: Run FTS benchmark (baseline)
        if: steps.baseline-build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -euo pipefail
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          INSTANCE="$PWD/.bench_instance"
          cleanup() {
            python3 .github/script/seekdb/sdb.py stop --base-dir "$INSTANCE" || true
          }
          trap cleanup EXIT

          rm -rf "$INSTANCE"
          python3 .github/script/seekdb/sdb.py start \
            --binary "$PWD/build_release/src/observer/seekdb" \
            --base-dir "$INSTANCE" \
            --port 2881
          python3 .github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT_ROOT/bin/obclient" \
            --base-dir "$INSTANCE" \
            --host 127.0.0.1 \
            --port 2881 \
            --user root \
            --timeout 600

          for run in $(seq 1 6); do
            echo "=== BENCH RUN baseline ${run}/6 ==="
            MYSQL="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -N -s -A --default-character-set=utf8mb4" \
            MYSQL_VERBOSE="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -A --default-character-set=utf8mb4" \
            LABEL=baseline \
            OUTPUT="$GITHUB_WORKSPACE/fts_bench_before.txt" \
            bash tools/benchmark/fts_large_bench.sh
          done

      - name: Score branch report against the official baseline
        if: always()
        run: |
          if [ -f fts_bench_after.txt ]; then
            python3 tools/benchmark/fts_large_bench_score.py \
              fts_bench_after.txt | tee fts_bench_after_score.txt || true
          fi

      - name: Compare baseline and branch reports
        if: always()
        run: |
          python3 - "$PWD/fts_bench_before.txt" "$PWD/fts_bench_after.txt" <<'PY'
          import re
          import sys
          from pathlib import Path
          from statistics import median

          metric_re = re.compile(r"^\s*([A-Za-z0-9_]+):\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+))\s*$")

          def load(path):
              p = Path(path)
              if not p.is_file():
                  return []
              runs = []
              current = None
              for line in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  if line.strip() == "FTS Large Benchmark Report":
                      current = {}
                      runs.append(current)
                      continue
                  if current is None:
                      continue
                  m = metric_re.match(line)
                  if m:
                      current[m.group(1)] = float(m.group(2))
              return runs

          def medians(runs):
              # The first report only warms the instance up, both sides drop it.
              measured = runs[1:] if len(runs) > 1 else runs
              out = {}
              for name in measured[0]:
                  values = [run[name] for run in measured if name in run]
                  if values:
                      out[name] = median(values)
              return out, len(measured)

          groups = {
              "build": ["build_ik_all_sec", "build_ik_content_sec", "build_beng_en_sec"],
              "tokenize": ["tokenize_ik_avg_ms", "tokenize_beng_avg_ms"],
              "query": ["query_cn_avg_ms", "query_beng_avg_ms",
                        "query_mixed_avg_ms", "query_limit_avg_ms"],
          }

          before_runs = load(sys.argv[1])
          after_runs = load(sys.argv[2])
          if not before_runs or not after_runs:
              print("before/after comparison skipped: report missing")
              print(f"  baseline reports: {len(before_runs)}")
              print(f"  branch reports:   {len(after_runs)}")
              raise SystemExit(0)

          before, before_n = medians(before_runs)
          after, after_n = medians(after_runs)

          print(f"FTS benchmark before/after (same runner, median of {after_n} runs)")
          print("========================================")
          category_improvements = []
          for category, metrics in groups.items():
              improvements = []
              print(f"[{category}]")
              for name in metrics:
                  if name not in before or name not in after:
                      print(f"  {name}: missing")
                      continue
                  base = before[name]
                  cur = after[name]
                  imp = (base - cur) / base if base > 0 else 0.0
                  improvements.append(imp)
                  print(f"  {name}: baseline={base:.4f} branch={cur:.4f} improvement={imp * 100:.2f}%")
              if improvements:
                  avg = sum(improvements) / len(improvements)
                  category_improvements.append(avg)
                  print(f"  {category}_improvement: {avg * 100:.2f}%")
          if category_improvements:
              mean_imp = sum(category_improvements) / len(category_improvements)
              print(f"mean_category_improvement: {mean_imp * 100:.2f}%")
          print("========================================")
          PY

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fts-benchmark-reports
          path: |
            fts_bench_after.txt
            fts_bench_before.txt
            fts_bench_after_score.txt
            build-j*.log
            baseline-build-j*.log
            seekdb-logs/**
          if-no-files-found: warn

      - name: Stop seekdb
        if: always()
        run: python3 .github/script/seekdb/sdb.py stop --base-dir "$PWD/.bench_instance" || true
