name: SeekDB competition build and mysqltest

# Cloud-side verification for the 2026 competition work.
#
# The job initializes the packaged third-party dependencies, configures and
# runs the release CMake build, compiles and links the complete `seekdb`
# executable, starts a local instance together with the deterministic mock AI
# service (0.0.0.0:8000) used by the official ai_function mysqltests, executes
# the ai_function and file_sql suites with the same client/environment as the
# repository CI, and
# publishes the test logs and reject files.
#
# Debug info is stripped (-g0) only to keep the build inside the hosted
# runner's disk budget; the optimisation level and NDEBUG match the release
# build produced by `build.sh release`.  Compilation retries automatically
# with lower parallelism if the runner runs out of memory.

on:
  workflow_dispatch:
  push:
    branches:
      - 2026-competition
    paths:
      - '.github/workflows/ci-check.yml'
      - '.github/script/seekdb/ai_mock_service.py'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - 'cmake/**'
      - 'deps/init/**'
      - 'tools/cmake/**'
      - 'rust/**'
      - 'tools/deploy/mysql_test/test_suite/ai_function/**'
      - 'tools/deploy/mysql_test/test_suite/file_sql/**'
      - 'tools/deploy/mysql_test/test_suite/ai_column/**'

permissions:
  contents: read

concurrency:
  group: seekdb-competition-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: 1

jobs:
  build-and-test:
    name: Full build and official mysqltest
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3 openssh-server


      - name: Enable passwordless SSH to localhost
        run: |
          set -euo pipefail
          sudo systemctl start ssh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          rm -f ~/.ssh/id_rsa ~/.ssh/id_rsa.pub
          ssh-keygen -t rsa -b 2048 -N '' -f ~/.ssh/id_rsa -q
          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          grep -qF "$(cat ~/.ssh/id_rsa.pub)" ~/.ssh/authorized_keys || \
            cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          for host in 127.0.0.1 localhost $(hostname -I); do
            ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          done
          ssh -o BatchMode=yes 127.0.0.1 true
          for host in $(hostname -I); do
            ssh -o BatchMode=yes "$host" true
          done

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Restore third-party dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/3rd
          key: seekdb-deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: Restore Rust build artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: build_release/rust-target
          key: seekdb-rust-release-${{ hashFiles('rust/**', 'cmake/Rust.cmake') }}

      - name: Restore compiler cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: seekdb-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seekdb-ccache-

      - name: Initialize dependencies and configure CMake
        run: |
          ./build.sh release --init \
            -DOB_USE_CCACHE=ON \
            -DNEED_PARSER_CACHE=OFF \
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG" \
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG"

      - name: Save third-party dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/3rd
          key: seekdb-deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: Save Rust build artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build_release/rust-target
          key: seekdb-rust-release-${{ hashFiles('rust/**', 'cmake/Rust.cmake') }}

      - name: Build seekdb binary
        timeout-minutes: 315
        run: |
          set -uo pipefail
          export PATH="$PWD/deps/3rd/usr/local/oceanbase/devtools/bin:$PATH"
          which ccache
          ccache -s || true
          cd build_release || exit 1

          rc=1
          for jobs in 4 3 2 1; do
            log="$GITHUB_WORKSPACE/build-j${jobs}.log"
            echo "=== make -j${jobs} seekdb ($(date -u +%H:%M:%S)) ==="
            started=$(date +%s)
            make -j"${jobs}" seekdb > "$log" 2>&1 &
            make_pid=$!
            (
              while kill -0 "$make_pid" 2>/dev/null; do
                sleep 300
                if kill -0 "$make_pid" 2>/dev/null; then
                  built=$(grep -c "Building CXX object" "$log" 2>/dev/null || true)
                  echo "[progress] $(date -u +%H:%M:%S) compiled objects: ${built:-0}"
                fi
              done
            ) &
            reporter=$!

            set +e
            wait "$make_pid"
            rc=$?
            set -e
            kill "$reporter" 2>/dev/null || true
            wait "$reporter" 2>/dev/null || true

            echo "make -j${jobs} exited with ${rc} after $(( $(date +%s) - started ))s"
            if [ "$rc" -eq 0 ]; then
              break
            fi
            tail -n 150 "$log"
            if grep -qE "Killed signal|Killed|out of memory|virtual memory exhausted|internal compiler error|Error 137" "$log"; then
              echo "resource exhaustion detected; retrying with lower parallelism"
              continue
            fi
            echo "build failed for a non-resource reason"
            exit "$rc"
          done

          if [ "$rc" -ne 0 ]; then
            echo "all build attempts failed"
            exit "$rc"
          fi
          ls -lh src/observer/seekdb

      - name: Save compiler cache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: seekdb-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify built binary
        run: |
          ls -lh build_release/src/observer/seekdb
          build_release/src/observer/seekdb --version

      - name: Start mock AI service
        run: |
          set -euo pipefail
          nohup python3 .github/script/seekdb/ai_mock_service.py \
            --host 0.0.0.0 --port 8000 > "$GITHUB_WORKSPACE/ai_mock.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/ai_mock.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "mock AI service is ready"
              exit 0
            fi
            sleep 1
          done
          echo "mock AI service did not become ready"
          cat "$GITHUB_WORKSPACE/ai_mock.log" || true
          exit 1

      - name: Start seekdb
        timeout-minutes: 30
        run: |
          set -euo pipefail
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          python3 .github/script/seekdb/sdb.py start \
            --binary "$PWD/build_release/src/observer/seekdb" \
            --base-dir "$PWD/.ai_instance" \
            --port 2881
          python3 .github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT_ROOT/bin/obclient" \
            --base-dir "$PWD/.ai_instance" \
            --host 127.0.0.1 \
            --port 2881 \
            --user root \
            --timeout 900

      - name: Run official mysqltests
        timeout-minutes: 90
        run: |
          set -euo pipefail
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          LOG_DIR="$GITHUB_WORKSPACE/ai_test_logs"
          mkdir -p "$LOG_DIR"

          cd tools/deploy
          "$CLIENT_ROOT/bin/obclient" -h127.0.0.1 -P2881 -uroot -A -c -Doceanbase < init.sql
          "$CLIENT_ROOT/bin/obclient" -h127.0.0.1 -P2881 -uroot -A -c -Dtest < init_user.sql

          export OBMYSQL_PORT=2881
          export OBMYSQL_MS0=127.0.0.1
          export OBMYSQL_MS0_DEV=127.0.0.1
          export OBMYSQL_PWD=admin
          export OBMYSQL_USR=admin
          export OBSERVER_DIR="$GITHUB_WORKSPACE/.ai_instance"
          export IS_BUSINESS=0
          export TENANT=mysql

          failed=0
          for spec in \
            ai_function:ai_prompt \
            ai_function:ai_function_enhancement \
            ai_function:ai_model_ddl \
            ai_function:ai_model_endpoint_ddl \
            ai_function:ai_model_lower_case_name_mysql0 \
            ai_function:ai_model_lower_case_name_mysql1 \
            file_sql:file_sql_basic \
            ai_column:ai_column_ddl \
            ai_column:ai_column_t1_dml \
            ai_column:ai_column_vector_index \
            ai_column:ai_column_worker \
            ai_column:ai_column_retry_strict; do
            suite=${spec%%:*}
            case_name=${spec##*:}
            CASE_DIR="$GITHUB_WORKSPACE/tools/deploy/mysql_test/test_suite/$suite"
            echo "::group::mysqltest ${case_name}"
            rm -f "$LOG_DIR/${case_name}.reject"
            set +e
            "$CLIENT_ROOT/bin/mysqltest" \
              --host=127.0.0.1 \
              --port=2881 \
              --user=admin \
              --password=admin \
              --database=test \
              --tmpdir="$LOG_DIR" \
              --logdir="$LOG_DIR" \
              --silent \
              --test-file="$CASE_DIR/t/${case_name}.test" \
              --result-file="$CASE_DIR/r/mysql/${case_name}.result" \
              --timer-file="$LOG_DIR/timer" \
              --tail-lines=20
            case_rc=$?
            set -e
            echo "::endgroup::"
            if [ "$case_rc" -ne 0 ]; then
              echo "mysqltest ${case_name} failed with ${case_rc}"
              if [ -f "$LOG_DIR/${case_name}.reject" ]; then
                echo "----- ${case_name}.reject (first 80 lines) -----"
                head -n 80 "$LOG_DIR/${case_name}.reject" || true
              fi
              failed=1
            fi
          done

          echo "----- mock AI service request log -----"
          tail -n 200 "$GITHUB_WORKSPACE/ai_mock.log" || true
          if [ "$failed" -ne 0 ]; then
            echo "----- AI model endpoints after the test run -----"
            "$CLIENT_ROOT/bin/obclient" -h127.0.0.1 -P2881 -uadmin -padmin -Dtest -c -e \
              "select ENDPOINT_NAME, PROVIDER, URL, ACCESS_KEY IS NULL AS ACCESS_KEY_IS_NULL, MAX_CONCURRENCY from oceanbase.DBA_OB_AI_MODEL_ENDPOINTS;" || true
          fi
          exit "$failed"

      - name: Stop seekdb
        if: always()
        run: python3 .github/script/seekdb/sdb.py stop --base-dir "$PWD/.ai_instance" || true

      - name: Stop mock AI service
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/ai_mock.pid" ]; then
            kill "$(cat "$GITHUB_WORKSPACE/ai_mock.pid")" 2>/dev/null || true
          fi

      - name: Upload AI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-test-logs
          path: |
            ai_test_logs/**
            ai_mock.log
            .ai_instance/log/**
            .ai_instance/etc/**
            build-j*.log
          include-hidden-files: true
          if-no-files-found: warn
