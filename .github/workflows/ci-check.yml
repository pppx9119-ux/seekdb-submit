name: CI Check

# Cloud-side compile check for the FTS performance branch.
#
# It initializes the third-party dependencies, configures CMake, builds the Rust
# export headers (config_bridge.h), then syntax-checks the *unity translation
# units* that contain the changed Storage/FTS and SQL/DAS sources.  The real
# build compiles those same unity files, so include order and transitive headers
# match production.  The seekdb binary is never linked.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/perf-optimization
    paths:
      - '.github/workflows/ci-check.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - 'cmake/**'
      - 'deps/init/**'
      - 'tools/cmake/**'
      - 'rust/**'

permissions:
  contents: read

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: FTS syntax check
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

      - name: Restore third-party dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/3rd
          key: seekdb-deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: Restore Rust build artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: build_release/rust-target
          key: seekdb-rust-release-${{ hashFiles('rust/**', 'cmake/Rust.cmake') }}

      - name: Initialize dependencies and configure CMake
        run: ./build.sh release --init

      - name: Save third-party dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/3rd
          key: seekdb-deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: Build Rust export headers
        run: cmake --build build_release --target rust_staticlibs_build --parallel "$(nproc)"

      - name: Save Rust build artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build_release/rust-target
          key: seekdb-rust-release-${{ hashFiles('rust/**', 'cmake/Rust.cmake') }}

      - name: Syntax check touched unity translation units
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import shlex
          import subprocess
          import sys

          BUILD_DIR = "build_release"
          COMMANDS = os.path.join(BUILD_DIR, "compile_commands.json")

          if not os.path.isfile(COMMANDS):
              sys.exit("missing " + COMMANDS + "; CMake configure did not complete")

          with open(COMMANDS, encoding="utf-8") as stream:
              entries = json.load(stream)


          def argv_of(entry):
              argv = entry.get("arguments")
              if argv is None:
                  argv = shlex.split(entry.get("command", ""))
              return list(argv)


          def resolved_file(entry):
              path = entry.get("file", "")
              if not os.path.isabs(path):
                  path = os.path.join(entry.get("directory", "."), path)
              return os.path.realpath(path)


          def entry_for(source):
              target = os.path.realpath(source)
              for entry in entries:
                  if resolved_file(entry) == target:
                      return entry
              return None


          def syntax_check(entry, source):
              argv = argv_of(entry)
              cleaned = []
              index = 0
              no_value = {"-MD", "-MMD", "-M", "-MM"}
              takes_value = {"-o", "-c", "-MT", "-MF", "-MQ", "-MJ"}
              while index < len(argv):
                  arg = argv[index]
                  if arg in no_value:
                      index += 1
                      continue
                  if arg in takes_value and index + 1 < len(argv):
                      index += 2
                      continue
                  cleaned.append(arg)
                  index += 1
              cleaned.extend(["-fsyntax-only", os.path.abspath(source)])
              return subprocess.run(cleaned, cwd=entry.get("directory", ".")).returncode


          # CMake writes group-mode unity sources under
          # CMakeFiles/<target>.dir/Unity/unity_<group>_cxx.cxx.
          unity_files = sorted(glob.glob(
              os.path.join(BUILD_DIR, "**", "unity_*_cxx.cxx"),
              recursive=True))
          print("unity translation units: {}".format(len(unity_files)), flush=True)
          if not unity_files:
              sys.exit("no CMake unity sources found under " + BUILD_DIR)

          touched = sorted(glob.glob("src/storage/fts/**/*.cpp", recursive=True))
          touched.append("src/sql/das/ob_das_domain_utils.cpp")

          unity_text = {}
          for path in unity_files:
              with open(path, encoding="utf-8", errors="replace") as stream:
                  unity_text[path] = stream.read()

          selected = []
          seen = set()
          uncovered = []
          for source in touched:
              owners = [path for path, text in unity_text.items() if source in text]
              if not owners:
                  uncovered.append(source)
                  continue
              for path in owners:
                  if path not in seen:
                      seen.add(path)
                      selected.append(path)
              print("{} -> {}".format(
                  source, ", ".join(os.path.basename(path) for path in owners)), flush=True)

          failed = []
          print("\nsyntax-checking {} unity translation units".format(len(selected)), flush=True)
          for path in selected:
              entry = entry_for(path)
              if entry is None:
                  sys.exit("no compile command for " + path)
              print("  checking " + path, flush=True)
              if syntax_check(entry, path) != 0:
                  failed.append(path)

          for source in uncovered:
              entry = entry_for(source)
              if entry is None:
                  sys.exit("touched source is not in a unity group and has no compile command: " + source)
              print("  checking standalone " + source, flush=True)
              if syntax_check(entry, source) != 0:
                  failed.append(source)

          if failed:
              print("\nSYNTAX CHECK FAILED:")
              for path in failed:
                  print("  " + path)
              sys.exit(1)
          print("\nAll syntax checks passed.")
          PY
